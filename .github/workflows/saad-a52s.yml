name: Build SAAD Samsung Galaxy A52s 5G

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_a52sxq"
  DEVICE_CODENAME : "a52sxq"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"
  
  KERNEL_SOURCE : "https://github.com/saadelasfur/android_kernel_samsung_sm7325.git"
 # KERNEL_SOURCE : "https://github.com/wfire06100/bone-fork.git"
  #KERNEL_SOURCE : "https://github.com/bone-machine/android_kernel_samsung_sm7325_a52s_5g.git"
  KERNEL_BRANCH : "ksu-next"
  #KERNEL_BRANCH : "aosp"
  
  #CLANG_SOURCE : "https://github.com/nduykha/kernel_samsung_sm7150/releases/download/clang/llvm.tar.xz"
  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/a52sxq_eur_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_IN_KERNEL: "true"

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "next" # magic, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "aosp_a16"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "Anykernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "true" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "wfire06100/NonGKI_Kernel_Build_2nd" # [your_name]/[your_patch] ->  "JackA1ltman/NonGKI_Kernel_Patches"gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mainline" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  HIDE_STUFF: "false" # hide some of the features"

  GENERATE_DTB: "true" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "a52sxq.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Samsung Galaxy A52s 5G (AOSP A16)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⏰ Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: wfire06100/bone-fork
          path: bone-fork
          fetch-depth: 1

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd "$GITHUB_WORKSPACE/device_kernel"

          DEFCONFIG_PATH="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          sed -i 's/CONFIG_LOCALVERSION="-Paradigm"/CONFIG_LOCALVERSION="-HaoticKernel"/g' "$DEFCONFIG_PATH"
          echo "[+] Kernel name has been updated to -HaoticKernel"

          if [ -f "drivers/kernelsu/kpm/super_access.c" ]; then
            sed -i 's/pids\\[PIDTYPE_PID\\].pid/thread_pid/g' drivers/kernelsu/kpm/super_access.c
            echo "[+] Fixed KPM feature"
          else
            echo "[-] drivers/kernelsu/kpm/super_access.c not found, skipping KPM sed patch"
          fi

          sed -i '/CONFIG_DEBUG_KERNEL/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KALLSYMS/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KALLSYMS_ALL/d' "$DEFCONFIG_PATH"

          cat <<EOF >> "$DEFCONFIG_PATH"
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          # Nothing


      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔍 Verify and Create DTBO Image
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          chmod +x ./tools/mkdtimg
          ls -l ./tools/mkdtimg
          
          echo "🔍 Searching for .dtbo files..."
          DTBO_FILES=$(find out -type f -name "*.dtbo")

          if [ -z "$DTBO_FILES" ]; then
            echo "❌ No .dtbo files found! Check your build log for dtbs errors."
            exit 1
          fi

          echo "📦 Creating dtbo.img..."
          ./tools/mkdtimg create out/arch/arm64/boot/dtbo.img --page_size=4096 ${DTBO_FILES}

          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            echo "✅ DTBO created successfully at out/arch/arm64/boot/dtbo.img"
          else
            echo "❌ DTBO creation failed! Listing files for debug:"
            find out/ -name "*.img"
            exit 1
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: 📦 Build EUR custom package from compiled artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "===> Install packaging dependencies"
          sudo apt-get update
          sudo apt-get install -y zip unzip bsdiff python3 curl

          mkdir -p "$GITHUB_WORKSPACE/tools"

          if [ ! -f "$GITHUB_WORKSPACE/tools/magiskboot_x86" ]; then
            mkdir -p "$GITHUB_WORKSPACE/tools/tmp_magiskboot"

            curl -fL \
              "https://github.com/magojohnji/magiskboot-linux/archive/refs/heads/main.zip" \
              -o "$GITHUB_WORKSPACE/tools/magiskboot-linux.zip"

            unzip -q "$GITHUB_WORKSPACE/tools/magiskboot-linux.zip" \
              -d "$GITHUB_WORKSPACE/tools/tmp_magiskboot"

            cp "$GITHUB_WORKSPACE/tools/tmp_magiskboot/magiskboot-linux-main/x86_64/magiskboot" \
              "$GITHUB_WORKSPACE/tools/magiskboot_x86"

            chmod +x "$GITHUB_WORKSPACE/tools/magiskboot_x86"
          fi

          if [ ! -f "$GITHUB_WORKSPACE/tools/avbtool.py" ]; then
            curl -fL \
              "https://android.googlesource.com/platform/external/avb/+/master/avbtool.py?format=TEXT" \
              | base64 -d > "$GITHUB_WORKSPACE/tools/avbtool.py"
            chmod +x "$GITHUB_WORKSPACE/tools/avbtool.py"
          fi

          MAIN_DIR="$GITHUB_WORKSPACE"
          SRC_DIR="$GITHUB_WORKSPACE/device_kernel"
          TEMPLATE_DIR="$GITHUB_WORKSPACE/bone-fork/template-zip-file"
          WORK_DIR="$GITHUB_WORKSPACE/output/eur-custom"
          ZIP_ROOT="$WORK_DIR/zip"
          TOOLS_DIR="$GITHUB_WORKSPACE/tools"

          LINEAGE_BASE_URL="https://mirrorbits.lineageos.org/full/a52sxq/20260520"
          LINEAGE_IMG_DIR="$WORK_DIR/lineage-images"
          STOCK_DIR="$LINEAGE_IMG_DIR"

          DATE="$(date +%Y%m%d)"
          RELEASE_VERSION="Fork-Ascendia-KSU"
          KSU_VER="v1.0.1"
          ASC_VARIANT="AOSP"
          RP_REV="SRPUE26A001"

          rm -rf "$WORK_DIR"
          mkdir -p "$ZIP_ROOT"
          mkdir -p "$WORK_DIR/Builds"
          mkdir -p "$LINEAGE_IMG_DIR"

          echo "===> Download LineageOS base images"
          curl -fL \
            "$LINEAGE_BASE_URL/boot.img" \
            -o "$LINEAGE_IMG_DIR/boot.img"

          curl -fL \
            "$LINEAGE_BASE_URL/vendor_boot.img" \
            -o "$LINEAGE_IMG_DIR/vendor_boot.img"

          echo "===> Validate required inputs"
          test -d "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/META-INF/com/google/android/update-binary"
          test -f "$TEMPLATE_DIR/META-INF/com/google/android/updater-script"
          test -f "$STOCK_DIR/boot.img"
          test -f "$STOCK_DIR/vendor_boot.img"
          test -f "$SRC_DIR/out/arch/arm64/boot/Image"
          test -f "$SRC_DIR/out/arch/arm64/boot/dtbo.img"

          echo "===> Copy template zip tree"
          cp -a "$TEMPLATE_DIR/." "$ZIP_ROOT/"

          mkdir -p "$ZIP_ROOT/mesa"
          mkdir -p "$ZIP_ROOT/vendor/lib/modules"

          echo "===> Check template script paths"
          grep -R "mesa/eur\|eur/" -n "$ZIP_ROOT/META-INF" || true

          echo "===> Repack boot.img with compiled kernel Image"
          rm -rf "$WORK_DIR/tmp_boot"
          mkdir -p "$WORK_DIR/tmp_boot"
          cp "$STOCK_DIR/boot.img" "$WORK_DIR/tmp_boot/boot.img"

          cd "$WORK_DIR/tmp_boot"
          python3 "$TOOLS_DIR/avbtool.py" erase_footer --image boot.img || true
          "$TOOLS_DIR/magiskboot_x86" --unpack boot.img
          rm -f kernel
          cp "$SRC_DIR/out/arch/arm64/boot/Image" kernel
          "$TOOLS_DIR/magiskboot_x86" --repack boot.img boot_new.img
          cp boot_new.img "$ZIP_ROOT/mesa/boot.img"

          echo "===> Inject compiled dtbo.img"
          cp "$SRC_DIR/out/arch/arm64/boot/dtbo.img" "$ZIP_ROOT/mesa/dtbo.img"

          echo "===> Repack vendor_boot.img with compiled dtb"
          rm -rf "$WORK_DIR/tmp_vendor_boot"
          mkdir -p "$WORK_DIR/tmp_vendor_boot"
          cp "$STOCK_DIR/vendor_boot.img" "$WORK_DIR/tmp_vendor_boot/vendor_boot.img"

          cd "$WORK_DIR/tmp_vendor_boot"
          python3 "$TOOLS_DIR/avbtool.py" erase_footer --image vendor_boot.img || true
          "$TOOLS_DIR/magiskboot_x86" --unpack vendor_boot.img || true

          echo "===> Inspect vendor_boot unpack outputs"
          ls -lah

          if [ ! -f header ] && [ ! -f ramdisk.cpio ] && [ ! -f dtb ]; then
            echo "[-] vendor_boot unpack did not extract expected files"
            exit 1
          fi

          if [ -f header ]; then
            sed "1 c\\name=${RP_REV}" header > header_new
            mv header_new header
          fi

          DTB_CANDIDATE_1="$SRC_DIR/out/arch/arm64/boot/dts/vendor/qcom/yupik.dtb"
          DTB_CANDIDATE_2="$(find "$SRC_DIR/out" -type f -name '*.dtb' | head -n 1 || true)"

          if [ -f "$DTB_CANDIDATE_1" ]; then
            rm -f dtb
            cp "$DTB_CANDIDATE_1" dtb
            echo "[+] Using DTB: $DTB_CANDIDATE_1"
          elif [ -n "$DTB_CANDIDATE_2" ] && [ -f "$DTB_CANDIDATE_2" ]; then
            rm -f dtb
            cp "$DTB_CANDIDATE_2" dtb
            echo "[+] Using DTB: $DTB_CANDIDATE_2"
          else
            echo "[-] No DTB found, vendor_boot will be repacked without dtb replacement"
          fi

          "$TOOLS_DIR/magiskboot_x86" --repack vendor_boot.img vendor_boot_new.img
          cp vendor_boot_new.img "$ZIP_ROOT/mesa/vendor_boot.img"

          echo "===> Copy kernel modules if build produced any"
          if find "$SRC_DIR/out" -type f -name '*.ko' | grep -q .; then
            find "$SRC_DIR/out" -type f -name '*.ko' -exec cp {} "$ZIP_ROOT/vendor/lib/modules/" \;

            MODULES_BASE="$(find "$SRC_DIR/out" -type f -path '*/lib/modules/*/modules.dep' | head -n 1 | xargs -r dirname || true)"
            if [ -n "${MODULES_BASE:-}" ] && [ -d "$MODULES_BASE" ]; then
              [ -f "$MODULES_BASE/modules.alias" ] && cp "$MODULES_BASE/modules.alias" "$ZIP_ROOT/vendor/lib/modules/"
              [ -f "$MODULES_BASE/modules.dep" ] && cp "$MODULES_BASE/modules.dep" "$ZIP_ROOT/vendor/lib/modules/"
              [ -f "$MODULES_BASE/modules.softdep" ] && cp "$MODULES_BASE/modules.softdep" "$ZIP_ROOT/vendor/lib/modules/"
              [ -f "$MODULES_BASE/modules.order" ] && cp "$MODULES_BASE/modules.order" "$ZIP_ROOT/vendor/lib/modules/modules.load" || true

              [ -f "$ZIP_ROOT/vendor/lib/modules/modules.dep" ] && \
                sed -i 's#\(kernel/[^: ]*/\)\([^: ]*\.ko\)#/vendor/lib/modules/\2#g' "$ZIP_ROOT/vendor/lib/modules/modules.dep"

              [ -f "$ZIP_ROOT/vendor/lib/modules/modules.load" ] && \
                sed -i 's#.*/##g' "$ZIP_ROOT/vendor/lib/modules/modules.load"
            fi
          else
            rm -rf "$ZIP_ROOT/example-modules"
          fi

          echo "===> Patch update-binary placeholders"
          sed -i -e "s/ksu_version/${KSU_VER}/g" "$ZIP_ROOT/META-INF/com/google/android/update-binary" || true
          sed -i -e "s/build_date/${DATE}/g" "$ZIP_ROOT/META-INF/com/google/android/update-binary" || true

          echo "===> Cleanup stock images from template root if present"
          rm -f "$ZIP_ROOT/images/boot.img" \
                "$ZIP_ROOT/images/dtbo.img" \
                "$ZIP_ROOT/images/vendor_boot.img"

          echo "===> Show packaged images"
          ls -lh "$ZIP_ROOT/mesa"
          sha256sum "$ZIP_ROOT/mesa/boot.img" "$ZIP_ROOT/mesa/vendor_boot.img" "$ZIP_ROOT/mesa/dtbo.img"

          echo "===> Create final flashable zip"
          cd "$ZIP_ROOT"
          FINAL_ZIP="${RELEASE_VERSION}_${KSU_VER}_${ASC_VARIANT}_a52sxq_${DATE}.zip"
          zip -r9 "$WORK_DIR/Builds/$FINAL_ZIP" mesa META-INF vendor images

          cd "$MAIN_DIR"

          echo "===> Final package created"
          ls -lh "$WORK_DIR/Builds/"

      - name: 📤 Upload EUR custom package
        uses: actions/upload-artifact@v4
        with:
          name: Fork-Ascendia-KSU-EUR
          path: ${{ github.workspace }}/output/eur-custom/Builds/*.zip
          if-no-files-found: error
          compression-level: 0
        
      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
