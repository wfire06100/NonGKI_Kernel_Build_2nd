name: Build Samsung Galaxy A52s 5G (Based AOSP A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "samsung_a52sxq"
  DEVICE_CODENAME: "a52sxq"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-none-linux-gnu-"
  EXTRA_CMDS: "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  KERNEL_SOURCE: "https://github.com/bone-machine/android_kernel_samsung_sm7325_a52s_5g.git"
  KERNEL_BRANCH: "ksu-next-aosp"

  CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: true
  GCC_64_SOURCE: "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-none-linux-gnu.git"
  GCC_64_BRANCH: "main"
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/a52sxq_kor_single_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""

  KERNELSU_AUTO_GET: "false"
  KERNELSU_AUTO_FORK: "next"

  SUSFS_ENABLE: true
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: true
  NEED_SAFE_DTBO: true

  ROM_TEXT: "aosp_a16"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "manual"

  PATCHES_SOURCE: "wfire06100/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Samsung Galaxy A52s 5G (AOSP A16)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-HaoticKernel"/g' arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          echo "[+] Kernel name has been updated to -HaoticKernel"

          sed -i '/CONFIG_DEBUG_KERNEL/d' arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          sed -i '/CONFIG_KALLSYMS/d' arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          sed -i '/CONFIG_KALLSYMS_ALL/d' arch/arm64/configs/vendor/a52sxq_kor_single_defconfig

          echo 'CONFIG_DEBUG_KERNEL=y' >> arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          echo 'CONFIG_KALLSYMS=y' >> arch/arm64/configs/vendor/a52sxq_kor_single_defconfig
          echo 'CONFIG_KALLSYMS_ALL=y' >> arch/arm64/configs/vendor/a52sxq_kor_single_defconfig

          echo "[+] Debug + KALLSYMS options enforced"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔍 Verify and Create DTBO Image
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          echo "🔍 Searching for .dtbo files..."
          DTBO_FILES=$(find out -type f -name "*.dtbo")

          if [ -z "$DTBO_FILES" ]; then
            echo "❌ No .dtbo files found! Check your build log for dtbs errors."
            find out -type f | grep -E 'dtb|dtbo' || true
            exit 1
          fi

          echo "📦 Creating dtbo.img..."
          ./tools/mkdtimg create out/arch/arm64/boot/dtbo.img --page_size=4096 ${DTBO_FILES}

          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            echo "✅ DTBO created successfully at out/arch/arm64/boot/dtbo.img"
          else
            echo "❌ DTBO creation failed! Listing files for debug:"
            find out/ -name "*.img"
            exit 1
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
